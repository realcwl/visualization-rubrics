<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   Helpers
   ===================================================================== */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const sstep = (a, b, x) => ease((x - a) / (b - a));
const fmt = v => (v < 0 ? '−' + (-v) : String(v));
const SUB = '₀₁₂₃₄₅₆₇₈₉';
const sub = n => String(n).split('').map(c => SUB[+c]).join('');

// Monotone cubic through (x, y) points (Fritsch–Carlson): smooth, never overshoots, holds flat where y repeats.
function monotone(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), d = [], m = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  const f = x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
  f.x0 = xs[0]; f.x1 = xs[n - 1];
  return f;
}

/* =====================================================================
   The 4×4 model. Weight-stationary dataflow, as in the TPU:
   weights shift down into each cell, activations move right one cell
   per step, partial sums move down one cell per step.
   Cell (k, n): array row k (contraction index), column n (output column).
   ===================================================================== */
const K = 4, N = 4, M = 4;
const X0 = [[1, 3, -1, 2], [2, -1, 3, 1], [-2, 1, 2, 3], [3, 2, -1, -2]];
const W0 = [[2, -1, 1, 3], [1, 2, -2, 1], [-1, 3, 2, 2], [3, 1, 1, -1]];
let seed = 20251028;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const VALS = [-3, -2, -1, 1, 2, 3];
const rmat = () => Array.from({ length: 4 }, () => Array.from({ length: 4 }, () => VALS[Math.floor(rnd() * 6)]));

// Weight tiles: L = step the first value enters the top of column 0.
const TILES = [{ W: W0, L: 0 }, { W: rmat(), L: 16 }, { W: rmat(), L: 20 }];
// Blocks of LHS rows: s = step row 0 of the block enters cell (0, 0). Run 0 is the worked example, run 1 the stream.
const BLOCKS = [
  { X: X0, s: 4, tile: 0, run: 0 },
  { X: rmat(), s: 16, tile: 0, run: 1 },
  { X: rmat(), s: 20, tile: 1, run: 1 },
  { X: rmat(), s: 24, tile: 2, run: 1 },
  { X: rmat(), s: 28, tile: 2, run: 1 },
];
TILES.forEach((t, j) => { t.first = Math.min(...BLOCKS.filter(b => b.tile === j).map(b => b.s)); });
// Direct product, used to check what the array produces.
for (const B of BLOCKS) {
  const W = TILES[B.tile].W;
  B.Y = B.X.map(row => W[0].map((_, n) => row.reduce((acc, x, k) => acc + x * W[k][n], 0)));
}
// Partial sum after the first `terms` cells of column n, in the order the array adds them.
const partial = (B, m, n, terms) => { let p = 0; for (let k = 0; k < terms; k++) p += B.X[m][k] * TILES[B.tile].W[k][n]; return p; };
// The first activation of a tile's first block flips each cell from the spare register to the live one.
const swapAt = (j, k, n) => TILES[j].first + k + n;

function macsAt(t, run) {
  let c = 0;
  for (const B of BLOCKS) {
    if (run != null && B.run !== run) continue;
    for (let k = 0; k < K; k++) for (let n = 0; n < N; n++) { const m = t - B.s - k - n; if (m >= 0 && m < M) c++; }
  }
  return c;
}

// Phases inside one step, drawn in sequence for legibility (hardware latches everything on one clock edge):
// 0.00–0.30 activations move right · 0.22–0.40 weight latch · 0.45 multiply-add · 0.55–0.85 sums and weights move down
const frac = x => x - Math.floor(x);
const hopA = tau => Math.floor(tau) - 1 + ease(frac(tau) / 0.3);
const hopP = tau => Math.floor(tau) + ease((frac(tau) - 0.55) / 0.3);
const cx = n => n - 1.5, cz = k => k - 1.5;
const comp = r => (r >= -1 ? r : -1 + 0.5 * (r + 1));      // queues outside the array pack at half pitch
const Y_ACT = 0.56, Y_PS = 0.56, Y_SH = 0.15, Y_W = 0.3;
const zY = m => 3.2 + 0.58 * m;

/* =====================================================================
   The 256×256 model (shader-drawn): same rules, one LHS row per step.
   ===================================================================== */
const BIG = { L: 0, S1: 256, M1: 8, S2: 576, M2: 1024 };
const diag = d => (d < 0 || d > 510 ? 0 : d <= 255 ? d + 1 : 511 - d);
const CUM = new Float64Array(513); for (let d = 0; d < 512; d++) CUM[d + 1] = CUM[d] + diag(d);
const cellsOnDiags = (lo, hi) => { lo = Math.max(0, lo); hi = Math.min(510, hi); return hi < lo ? 0 : CUM[hi + 1] - CUM[lo]; };
const busyBig = (t, s, m) => cellsOnDiags(t - s - m + 1, t - s);
const utilC = t => (busyBig(t, BIG.S1, BIG.M1) + busyBig(t, BIG.S2, BIG.M2)) / 65536;

/* =====================================================================
   Timeline: global time T (seconds) drives everything, so scrubbing is exact.
   ===================================================================== */
const TOTAL = 124;
const TAU_S = monotone([[0, -2.2], [6.6, -2.2], [13.6, 3.3], [18.6, 5.9], [20.4, 6.08], [27, 6.9], [29, 7.25], [39, 11.9], [46, 15.5], [48, 15.8], [70, 39.2], [71, 39.4]]);
const TAU_C = monotone([[70, -60], [74, -30], [76, 0], [81, 330], [86, 680], [92, 1120], [97, 1580], [101.5, 2110], [104, 2125]]);
const TAU_D = monotone([[103, -60], [106, -20], [112, 300], [124, 1100]]);

const CH = [
  { t0: 0, t1: 7, short: 'Grid', title: 'A grid of multiply-adders', sim: 'S',
    desc: 'The MXU, the TPU’s matrix unit, is a systolic array: a square grid of cells that each multiply and add, wired only to their neighbours. TPU7x uses 256 × 256 cells. This model has 4 × 4, so every number fits on screen. It computes Y = X · W.' },
  { t0: 7, t1: 14, short: 'Weights', title: 'Weights shift in', sim: 'S',
    desc: 'The weights (the RHS) enter from the top and shift down one row per step into each cell’s spare register. Column n starts n steps after column 0, so the tile arrives as a diagonal. Every value passes through the cells above its own, so the bottom row goes in first.' },

uniform vec3 uBase, uRim, uWgt, uAct, uPs, uRes;
varying vec2 vG;
float boxd(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
float inBlock(float m, float M){ return step(0.0, m) * step(m, M - 1.0); }
void main(){

    cg.strokeStyle = '#38d9ff'; cg.stroke(); cg.restore();
    cg.fillStyle = '#e4ecf3'; cg.fillRect(xn - 1, top, 2, h);
    cg.fillStyle = '#5b6a7b'; cg.fillText('step 0', 0, bot + 4); cg.textAlign = 'right'; cg.fillText('2,125', CW, bot + 4); cg.textAlign = 'left';
    cg.fillText('100%', 2, top + 2);
  }
}

/* =====================================================================
   Labels per frame
   ===================================================================== */
function updateLabels(T, tau, tauC, tauD, vis) {
  for (const L of LBL) L.op = 0;
  const win = (a, b, x, f = 0.6) => sstep(a, a + f, x) * (1 - sstep(b - f, b, x));
  // 4×4 scene
  LB.W.p.set(1.0, 0.2, -5.6); LB.W.op = vis * Math.max(win(0.4, 19, T), win(48.6, 58, T));
  if (T > 40) LB.W.txt.firstChild.textContent = 'W₂, W₃ · next weight tiles'; else LB.W.txt.firstChild.textContent = 'W · weights (RHS)';
  LB.X.p.set(-8.9, 0.6, -1.85); LB.X.op = vis * Math.max(win(0.4, 19, T), win(48.6, 58, T));
  LB.X.txt.firstChild.textContent = T > 40 ? 'next blocks of X' : 'X · activations (LHS)';
  LB.Y.p.set(-2.0, 0.1, 3.3); LB.Y.op = vis * win(0.4, 48.5, T);
  for (let m = 0; m < 4; m++) {
    const c = ACH[m * 4];   // block 0, element k = 0 of row m
    const col = hopA(tau) - (BLOCKS[0].s + m);
    LB.xrow[m].p.set(c.position.x, 0.7, c.position.z - 0.42);
    LB.xrow[m].op = vis * win(0.4, 19, T) * (1 - sstep(-1.4, -0.9, col));
  }
  const pe = new THREE.Vector3(cx(1), 0, cz(1)), wc = win(20.3, 27.6, T, 0.8);
  LB.cA.p.set(pe.x - 0.25, 0.62, pe.z - 0.25); LB.cA.op = wc * (tau > 6.02 ? 1 : 0.0);
  LB.cP.p.set(pe.x + 0.25, 0.62, pe.z + 0.25); LB.cP.op = wc;
  LB.cW.p.set(pe.x, 0.34, pe.z); LB.cW.op = wc * sstep(6.3, 6.4, tau);
  LB.cS.p.set(pe.x - 0.25, 0.12, pe.z + 0.25); LB.cS.op = wc;
  const tc = psChip(0, 1, 2);
  LB.track.p.copy(tc.position).add(_f.set(0.12, 0.08, -0.1)); LB.track.op = (tc.visible ? 1 : 0) * win(29.4, 40, T);
  LB.out.p.set(-1.9, 0.05, 3.0); LB.out.op = vis * win(52, 69, T);
  // 256 × 256
  const bv = sstep(73, 75, T) * (1 - sstep(104, 106, T));
  LB.corner.p.set(-2, 0, -2); LB.corner.op = win(72.5, 79.5, T);
  LB.size.p.set(254, 0, -2); LB.size.op = bv;
  LB.bW.p.set(40, 0, -8); LB.bW.op = bv * win(75, 92, T);
  LB.bX.p.set(-8, 0, 30); LB.bX.op = bv * win(78, 96, T);
  LB.bY.p.set(254, 0, 262); LB.bY.op = bv * win(83, 103, T);
  const tcI = Math.floor(tauC), dc = tcI - BIG.S1 - 4;
  if (dc > 0 && dc < 500) { const k = clamp(dc / 2, 0, 255), n = clamp(dc - k, 0, 255); LB.chunk.p.set(cx(n), 0, cz(k)); }
  LB.chunk.op = win(79.8, 87.5, T) * (dc > 0 && dc < 500 ? 1 : 0);
  const ds = tcI - BIG.S2;
  if (ds > 0 && ds < 500) { const k = clamp(ds / 2, 0, 255), n = clamp(ds - k, 0, 255); LB.stream.p.set(cx(n), 0, cz(k)); }
  LB.stream.op = win(85, 91.5, T) * (ds > 0 && ds < 500 ? 1 : 0);
  // two MXUs
  LB.m0.p.set(60, 0, 262); LB.m0.op = win(106, 124.2, T, 1);
  LB.m1.p.set(356, 0, 262); LB.m1.op = win(106, 124.2, T, 1);
  LB.bus.p.set(150, 0, -34); LB.bus.op = win(107, 124.2, T, 1);
  LB.tc0.p.set(-30, 0, -60); LB.tc0.op = win(117, 124.2, T, 1);
  LB.tc1.p.set(-30, 0, 360); LB.tc1.op = win(117.5, 124.2, T, 1);
}

/* =====================================================================
   256×256 per frame
   ===================================================================== */
function updateBig(T, tauC, tauD) {
  const vC = sstep(70.6, 73.4, T);
  const inD = T >= 104;
  const set = (A, op, t, sch) => {
    A.mesh.visible = op > 0.004;
    if (!A.mesh.visible) return;
    A.u.uOp.value = op; A.u.uT.value = t; A.frame.material.opacity = 0.6 * op;
    A.u.uL.value = sch.L; A.u.uS1.value = sch.S1; A.u.uM1.value = sch.M1; A.u.uS2.value = sch.S2; A.u.uM2.value = sch.M2;
  };
  const D0 = { L: -3000, S1: 0, M1: 1e7, S2: -1e9, M2: 0 };
  const D1 = { L: -3000, S1: -420, M1: 1e7, S2: -1e9, M2: 0 };
  set(MXU0, vC, inD ? tauD : tauC, inD ? D0 : BIG);
  set(MXU1, inD ? sstep(104.5, 107.5, T) : 0, tauD, D0);
  set(MXU2, inD ? 0.55 * sstep(115.5, 119, T) : 0, tauD, D1);
  set(MXU3, inD ? 0.55 * sstep(115.5, 119, T) : 0, tauD, D1);
  const bo = inD ? sstep(105.5, 108, T) : 0;
  for (const B of BUSES) { B.m.visible = bo > 0.004; B.u.uOp.value = bo; B.u.uT.value = tauD; }
}

/* =====================================================================
   Timeline UI
   ===================================================================== */
const track = $('track'), timeEl = $('time'), playBtn = $('play'), hint = $('hint'), fadeEl = $('fade');
const SEGS = CH.map((C, i) => {
  const s = document.createElement('div'); s.className = 'seg'; s.style.flex = `${C.t1 - C.t0} 1 0`;
  s.innerHTML = `<i></i><span>${i + 1}<em> ${C.short}</em></span>`; s.title = `${i + 1}. ${C.title}`;
  track.appendChild(s); return s;
});
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function updateBar(T, ci) {
  SEGS.forEach((s, i) => { const C = CH[i]; s.firstChild.style.width = `${clamp((T - C.t0) / (C.t1 - C.t0)) * 100}%`; });
  timeEl.textContent = `${mmss(T)} / ${mmss(TOTAL)}`;
  track.setAttribute('aria-valuenow', T.toFixed(0));
  track.setAttribute('aria-valuetext', `${mmss(T)}, chapter ${ci + 1}: ${CH[ci].title}`);
}
function tFromX(clientX) {
  const segs = SEGS.map(s => s.getBoundingClientRect());
  for (let i = 0; i < segs.length; i++) {
    const r = segs[i], next = segs[i + 1];
    const right = next ? (r.right + next.left) / 2 : r.right;
    if (clientX <= right || !next) return CH[i].t0 + clamp((clientX - r.left) / r.width) * (CH[i].t1 - CH[i].t0 - 0.001);
  }
  return 0;
}
let T = 0, playing = true, scrubbing = false, wasPlaying = true;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduceMotion) playing = false;
function setPlaying(p) {
  playing = p;
  playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play');
  playBtn.innerHTML = p
    ? '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1" width="3" height="10" rx=".6"/><rect x="7.5" y="1" width="3" height="10" rx=".6"/></svg>'
    : '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.2v9.6a.6.6 0 0 0 .9.5l7.6-4.8a.6.6 0 0 0 0-1L3.4.7a.6.6 0 0 0-.9.5z"/></svg>';
}
setPlaying(playing);
playBtn.addEventListener('click', () => { setPlaying(!playing); dismissHint(); });
track.addEventListener('pointerdown', e => {
  scrubbing = true; wasPlaying = playing; setPlaying(false); track.setPointerCapture(e.pointerId);
  T = tFromX(e.clientX); dismissHint();
});
track.addEventListener('pointermove', e => { if (scrubbing) T = tFromX(e.clientX); });
const endScrub = () => { if (!scrubbing) return; scrubbing = false; setPlaying(wasPlaying); };
track.addEventListener('pointerup', endScrub); track.addEventListener('pointercancel', endScrub);
track.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') return;   // handled globally
  if (e.key === 'Home') { T = 0; e.preventDefault(); }
  if (e.key === 'End') { T = TOTAL - 0.01; e.preventDefault(); }
});

// One-step jumps: find the time where the active simulation reaches the next whole step.
function stepBy(dir) {
  setPlaying(false);
  const ci = chapterAt(T), C = CH[ci];
  const f = C.sim === 'S' ? TAU_S : C.sim === 'C' ? TAU_C : TAU_D;
  const lo = C.sim === 'S' ? 0 : C.sim === 'C' ? 71 : 104, hi = C.sim === 'S' ? 71 : C.sim === 'C' ? 104 : TOTAL;
  const cur = f(T), goal = dir > 0 ? Math.floor(cur - 0.9 + 1e-6) + 1.9 : Math.ceil(cur - 0.9 - 1e-6) - 0.1;
  if ((dir > 0 && f(hi - 1e-3) < goal) || (dir < 0 && f(lo) > goal)) { T = clamp(T + dir * 1.5, 0, TOTAL - 0.01); return; }
  let a = dir > 0 ? T : lo, b = dir > 0 ? hi : T;
  for (let i = 0; i < 40; i++) { const mid = (a + b) / 2; if (f(mid) < goal) a = mid; else b = mid; }
  T = clamp(b, 0, TOTAL - 0.01);
}
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button')) { if (e.key === ' ') return; }
  if (e.key === ' ' || e.key === 'k') { setPlaying(!playing); e.preventDefault(); dismissHint(); }
  else if (e.key === 'ArrowRight') { stepBy(1); e.preventDefault(); dismissHint(); }
  else if (e.key === 'ArrowLeft') { stepBy(-1); e.preventDefault(); dismissHint(); }
});

/* ---------- orbit / zoom / pan on the stage ---------- */
const ptrs = new Map(); let pinch0 = 0, ld0 = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey });
  canvas.classList.add('drag'); user.last = performance.now(); dismissHint();
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); ld0 = user.ld; }
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; user.last = performance.now();
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0 > 0) user.ld = clamp(ld0 - Math.log(d / pinch0), -2.5, 2.5); return; }
  if (p.pan) {
    const d = camState.d * Math.exp(user.ld), s = d * 0.0014, az = (camState.az + user.az) * D2R;
    user.pan.x += (-dx * Math.cos(az) - dy * Math.sin(az)) * s;
    user.pan.z += (dx * Math.sin(az) - dy * Math.cos(az)) * s;
  } else { user.az -= dx * 0.25; user.el = clamp(user.el + dy * 0.18, -60, 40); }
});
const pEnd = e => { ptrs.delete(e.pointerId); if (!ptrs.size) canvas.classList.remove('drag'); pinch0 = 0; };
canvas.addEventListener('pointerup', pEnd); canvas.addEventListener('pointercancel', pEnd);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); user.ld = clamp(user.ld + e.deltaY * 0.0012, -2.5, 2.5); user.last = performance.now(); dismissHint(); }, { passive: false });
canvas.addEventListener('dblclick', () => { user.az = user.el = user.ld = 0; user.pan.set(0, 0, 0); });
let hintGone = false;
function dismissHint() { if (hintGone) return; hintGone = true; hint.style.opacity = '0'; }
if (matchMedia('(pointer: coarse)').matches) hint.textContent = 'Drag to orbit · pinch to zoom · tap ▶ to pause';

/* =====================================================================
   Main loop
   ===================================================================== */
let last = performance.now(), frames = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !scrubbing) { T += dt; if (T >= TOTAL) T -= TOTAL; }
  if (!hintGone && T > 22) dismissHint();
  render(T, dt, now);
  frames++;
  if (frames === 3) window.systolicReady = true;
  requestAnimationFrame(frame);
}
function render(T, dt = 0, now = performance.now()) {
  const ci = chapterAt(T);
  const tau = TAU_S(T), tauC = TAU_C(T), tauD = TAU_D(T);
  const vis = 1 - sstep(70.2, 72.4, T);
  updateSmall(T, tau, vis);
  updateBig(T, tauC, tauD);
  updateCamera(T, tau, dt, now);
  updateLabels(T, tau, tauC, tauD, vis);
  placeLabels();
  updateHud(T, tau, tauC, ci);
  updateBar(T, ci);
  fadeEl.style.opacity = Math.max(sstep(122.7, 124, T), 1 - sstep(0, 0.5, T)).toFixed(3);
  composer.render();
}

// Test and embedding hooks: jump to a time (pauses playback).
window.systolic = { seek(t) { T = clamp(t, 0, TOTAL - 0.001); setPlaying(false); render(T, 0, performance.now()); }, play() { setPlaying(true); }, get T() { return T; } };

(async () => {
  try { await Promise.race([Promise.all([document.fonts.load('500 64px "IBM Plex Mono"'), document.fonts.ready]), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  buildSmall();
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
