<style>
/* Layout: one full-bleed WebGL stage. Reading column top-left over a soft scrim, depth gauge on the right edge, scale bar bottom-left. */
:root{
  --bg:#04070b;
  --ink:#e4ecf3;
  --ink-2:#c3cfda;
  --muted:#8d9db0;
  --faint:#5b6a7b;
  --rule:rgba(141,157,176,.24);
  --scrim:rgba(4,7,11,.9);
  --act:#38d9ff;   /* activations, electrical ICI */
  --wgt:#8f9bff;   /* weights + KV cache streamed from HBM */
  --res:#ffd166;   /* results, generated tokens */
  --opt:#ff7a45;   /* optical ICI through OCS */
  --pci:#6fe3a0;   /* PCIe host I/O */
  --d2d:#ff5fd2;   /* die-to-die */
  --req:#eef5ff;   /* requests, control */
  --cool:#4aa3ff;  /* coolant */
  --font-display:"Saira Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--font-body);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#stage.drag{cursor:grabbing}
#stage:focus-visible{box-shadow:inset 0 0 0 2px var(--act)}
.scrim{position:fixed;left:0;top:0;width:min(720px,100%);height:min(720px,86%);pointer-events:none;background:radial-gradient(110% 100% at 0% 0%,var(--scrim) 0%,rgba(4,7,11,.74) 40%,rgba(4,7,11,0) 76%)}

#hud.swap{opacity:0}
.eyebrow{font:500 11px/1.2 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:.7em;flex-wrap:wrap}
.eyebrow b{color:var(--act);font-weight:500}
.eyebrow span+span::before{content:"·";margin-right:.7em;color:var(--faint)}
h1{font:600 clamp(30px,4vw,44px)/1 var(--font-display);letter-spacing:.01em;margin:.3em 0 .34em;text-wrap:balance}
#desc{font:400 14px/1.55 var(--font-body);color:var(--ink-2);margin:0 0 14px;max-width:62ch}
#stats{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0 0 14px;font-variant-numeric:tabular-nums}
#stats dt{font:500 10.5px/1.65 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
#stats dd{margin:0;font:500 13px/1.45 var(--font-mono);color:var(--ink);min-width:0}
#legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;font:400 11.5px/1.4 var(--font-mono);color:var(--muted)}
#legend li{display:flex;align-items:center;gap:6px}
#legend i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;display:inline-block}
#gauge{position:fixed;right:var(--gr);top:50%;transform:translateY(-50%);pointer-events:none;font:500 10.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;padding-right:14px}
#gauge .row{display:flex;align-items:center;justify-content:flex-end;height:38px;color:var(--faint);transition:color .3s;text-align:right}
#gauge .row.on{color:var(--ink)}
#gauge .row small{display:block;margin-top:4px;font-size:9.5px;letter-spacing:.03em;text-transform:none;color:var(--faint)}
#gauge .rail{position:absolute;right:0;top:19px;bottom:19px;width:1px;background:var(--rule)}
#gauge .row::after{content:"";position:absolute;right:0;width:6px;height:1px;background:currentColor}
#gauge .knob{position:absolute;right:-4px;top:19px;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--act);box-shadow:0 0 12px var(--act)}
#scale{position:fixed;left:var(--gl);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);font:500 11px/1 var(--font-mono);color:var(--muted);pointer-events:none;display:flex;flex-direction:column;gap:7px;font-variant-numeric:tabular-nums}
#scale .bar{height:6px;width:100px;border:1px solid var(--muted);border-top:0}
#scale.logical .bar{display:none}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);font:500 12px/1 var(--font-mono);letter-spacing:.05em;color:var(--ink);background:rgba(4,7,11,.66);padding:10px 15px;border:1px solid var(--rule);border-radius:999px;pointer-events:none;transition:opacity .8s;white-space:nowrap}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;width:0;height:0;color:var(--act);visibility:hidden;will-change:transform,opacity}
.lbl .dot{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box}
.lbl .stem{position:absolute;left:0;top:0;width:20px;height:1px;background:currentColor;opacity:.75;transform-origin:0 0;transform:rotate(-38deg)}
.lbl .txt{position:absolute;left:16px;bottom:10px;white-space:nowrap;font:500 11px/1.3 var(--font-mono);color:var(--ink);text-shadow:0 1px 2px #000,0 0 10px rgba(0,0,0,.95),0 0 3px #000}
.lbl .txt span{display:block;font-weight:400;font-size:10.5px;color:var(--ink-2)}
.lbl.l .stem{transform:rotate(-142deg)}
.lbl.l .txt{left:auto;right:16px;text-align:right}
noscript{position:fixed;inset:auto 16px 16px;color:var(--ink)}
@media (max-width:700px){
  #hud{width:calc(100% - var(--gl) - var(--gr) - 34px)}
  h1{font-size:28px}
  #desc{font-size:12.5px;line-height:1.45;margin-bottom:10px}
  #stats{gap:3px 10px;margin-bottom:8px}
  #stats dd{font-size:11.5px}
  #legend{display:none}
  #gauge .row{height:26px}
  #gauge .row span{display:none}
  #gauge .rail{top:13px;bottom:13px}
  .scrim{height:85%;width:100%}
  .lbl .txt{font-size:10px}
  .lbl .txt span{display:none}
}
@media (max-height:560px){#stats,#legend{display:none}}
@media (prefers-reduced-motion:reduce){#hud,#hint,#gauge .row{transition:none}}

  else if (k === 'ArrowRight' || k === 'd') { azT -= 0.12; lastInput = performance.now(); }
});
function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setPixelRatio(PR); renderer.setSize(W, H, false);
  composer.setPixelRatio(PR); composer.setSize(W, H);
  for (const L of LV) { L.camera.aspect = W / H; L.camera.updateProjectionMatrix(); }
  PX.value = H * PR / (2 * Math.tan(FOV * Math.PI / 360));
}
addEventListener('resize', resize); resize();
setTimeout(() => { if (zT < 0) zT = 0; }, 350);

/* ======================================================================
   Frame loop
   ====================================================================== */
const dir = new V3();
let prev = performance.now(), time = 0, cycle = 300, ft = 0, fn = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  time += dt * (REDUCED ? 0.4 : 1);
  zC += (zT - zC) * (1 - Math.exp(-dt * 5)); if (Math.abs(zT - zC) < 1e-4) zC = zT;
  const idle = now - lastInput;
  if (!REDUCED && idle > 9000) azT += dt * 0.015 * sstep(9000, 13000, idle);
  azU += (azT - azU) * (1 - Math.exp(-dt * 8)); elU += (elT - elU) * (1 - Math.exp(-dt * 8));
  const rate = lerp(110, 22, sstep(6.9, 7.6, zC)) * (REDUCED ? 0.4 : 1);
  cycle += dt * rate; U_CYCLE.value = cycle; U_TIME.value = time;

  const cam = camAt(zC), [a0, e0] = baseAng(zC);
  cam.d *= Math.pow(clamp(1.3 / (W / H), 1, 1.9), 0.8); // portrait screens: step back so the subject fits the width
  const az = a0 * deg + azU, el = clamp(e0 * deg + elU, 4 * deg, 86 * deg);
  dir.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
  const pos = cam.t.clone().addScaledVector(dir, cam.d);
  const list = [];
  for (const L of LV) {
    L.active = zC >= L.zStart - SWAP && zC <= L.zEnd + 1.0;
    if (!L.active) continue;
    const c = L.camera, k = convS(cam.j, L.idx), dk = cam.d * k;
    c.position.copy(convP(pos, cam.j, L.idx)); c.lookAt(convP(cam.t, cam.j, L.idx));
    c.near = dk * 0.015; c.far = dk * 3000; c.updateProjectionMatrix(); c.updateMatrixWorld();
    L.dim = 0.66 * sstep(L.zEnd - 0.12, L.zEnd + 0.22, zC);
    L.update(zC, time, dt); list.push(L);
  }
  levelsPass.list = list;
  composer.render(dt);
  updateLabels(zC); updateHUD(zC, cam, rate);
  hint.style.opacity = touched ? 0 : 1;

  ft += dt; fn++;
  if (fn === 90) { if (ft / fn > 0.03 && PR > 1) { PR = Math.max(1, PR - 0.25); resize(); } ft = 0; fn = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Small hook for automated checks: tpu.go(z) jumps to a zoom depth.
window.tpu = { go(z) { zT = zC = clamp(z, Z_MIN, Z_MAX); touched = true; lastInput = performance.now(); }, get z() { return zC; }, orbit(a, e) { azT = azU = a; elT = elU = e; } };
</script>
